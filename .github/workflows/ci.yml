# Tests et build sur les branches de travail et les pull requests.
name: Tests

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # Le binaire Electron ne sert qu'à l'appli de bureau, compilée et lancée sur Windows.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test
      - run: npm run build
      - run: npm run desktop:build
